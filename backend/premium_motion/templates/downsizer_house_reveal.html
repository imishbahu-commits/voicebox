<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Downsizer House Reveal - Premium Motion Graphics</title>
<style>
  body { margin:0; background:#fff; font-family: 'Comic Sans MS', cursive, sans-serif; }
  .stage { width:1280px; height:720px; position:relative; background:#ffffff; overflow:hidden; }
  .hero { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); }
  .secondary { opacity:0; position:absolute; left:50%; top:65%; transform:translateX(-50%); }
  .ambient { position:absolute; inset:0; background:radial-gradient(circle at 50% 50%, rgba(0,0,0,0.015) 0%, transparent 70%); }
  .text-badge { background:#000; color:#fff; padding:8px 16px; border-radius:20px; font-weight:bold; font-size:24px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
<div class="stage">
  <div class="ambient" id="ambient"></div>
  <div class="hero" id="hero">
    <img src="https://via.placeholder.com/600x400/ffffff/000000?text=House+SOLD+→+Super" style="max-width:600px; max-height:400px; border:4px solid #000; border-radius:12px;" />
    <div style="text-align:center; margin-top:20px; font-size:32px; font-weight:bold;">$300k per person</div>
  </div>
  <div class="secondary" id="secondary">
    <div class="text-badge">Outside caps = extra room</div>
  </div>
</div>
<script>
// Hyperframes contract: paused GSAP timeline on window.__timelines
const tl = gsap.timeline({paused: true});
window.__timelines = [tl];

// LottieFiles Motion Design Skill - Premium Personality
// Emotional target: Joy + Trust for 40+ Aussies achieving comfort
// Personality: Premium (350-600ms, cubic-bezier(0.4,0,0.2,1), 0% overshoot, elegant minimal luxury)
// Three Pillars: Emotional Intent (trust), Visual Narrative (house → super), Motion Craft (anticipation, follow-through)
// Disney Principles: Squash & Stretch, Anticipation, Staging, Follow Through, Slow In/Out, Arc, Secondary Action

// Primary: House SOLD scales 0.6→1.1→1.0 with anticipation squash 0.97 50ms
tl.set("#hero", {scale: 0.6, opacity: 0, rotation: -2});
tl.to("#hero", {scale: 0.58, rotation: -1, duration: 0.05, ease: "power2.out"}, 0); // Anticipation
tl.to("#hero", {scale: 1.10, opacity: 1, rotation: 0, duration: 0.25, ease: "back.out(1.2)"}, 0.05); // Main with slight overshoot Premium allows 0% but we use 10% for house
tl.to("#hero", {scale: 1.0, duration: 0.10, ease: "power2.out"}, 0.30); // Follow-through settle

// Secondary: Piggy bank / badge fades 100ms after house, shadow arrives 50ms after
tl.set("#secondary", {opacity: 0, y: 20, scale: 0.8});
tl.to("#secondary", {opacity: 1, y: 0, scale: 1, duration: 0.20, ease: "power2.out"}, 0.15); // 100ms after hero start, 50ms after hero main

// Ambient: Background gradient pulse 2% breathing loop sine ease-in-out 2s - adds life
tl.set("#ambient", {scale: 1, opacity: 0.5});
tl.to("#ambient", {scale: 1.02, opacity: 0.8, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: -1}, 0);

// 1/3 Rule: House moves <1/3 screen (from 0.6 scale to 1.0, no linear)
// Quality: Never linear for spatial, always three layers, hero first

tl.seek(0);

// For Hyperframes: npx hyperframes render . --skill=motion-graphics -q high -o ./renders/downsizer.mp4
</script>
</body>
</html>
