<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voicebox Studio — Videos</title>
<style>
  :root{
    --bg:#0d0f12; --panel:#151920; --panel2:#1c212b; --line:#262d3a;
    --txt:#e7ecf3; --dim:#8b96a8; --accent:#ff5c39; --accent2:#4ade80;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:16px 22px;
         border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  h1{font-size:17px;margin:0;letter-spacing:.4px}
  h1 span{color:var(--accent)}
  header .grow{flex:1}
  header a,header button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
                         border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer;
                         text-decoration:none;display:inline-block}
  header a:hover,header button:hover{border-color:#3a4457}
  .sub{padding:12px 22px 0;color:var(--dim);font-size:12px}
  .wrap{padding:16px 22px 40px;display:grid;gap:18px;max-width:1500px}
  .empty{padding:60px 22px;text-align:center;color:var(--dim)}
  .empty code{background:#0f1218;border:1px solid var(--line);border-radius:6px;
              padding:3px 7px;color:var(--txt)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .card .head{display:flex;align-items:baseline;gap:12px;padding:12px 16px;
              border-bottom:1px solid var(--line);flex-wrap:wrap}
  .card .title{font-weight:700;font-size:15px}
  .card .proj{color:var(--accent2);font:600 11px ui-monospace,monospace;
              text-transform:uppercase;letter-spacing:.7px}
  .card .meta{color:var(--dim);font:600 11px ui-monospace,monospace;margin-left:auto}
  .card video{display:block;width:100%;max-height:70vh;background:#000}
  .card .foot{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap;
              border-top:1px solid var(--line)}
  .card .foot a.dl{color:var(--accent);font-weight:700;font-size:12px;text-decoration:none;
                   border:1px solid var(--accent);border-radius:8px;padding:7px 11px}
  .card .foot a.dl:hover{background:var(--accent);color:#fff}
  .card .foot button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
                     border-radius:8px;padding:7px 11px;font:inherit;font-size:12px;cursor:pointer}
  .card .foot .grow{flex:1}
  .card img.sheet{display:block;width:100%;border-top:1px solid var(--line)}
  .playing{border-color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>Voicebox <span>Studio</span></h1>
  <span style="color:var(--dim);font-size:12px">rendered videos</span>
  <span class="grow"></span>
  <a href="beats">Beat inspector →</a>
  <button id="reload">↻ Reload</button>
</header>

<div class="sub" id="sub">loading…</div>
<div class="wrap" id="wrap"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => (s||'').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mb = b => (b/1048576).toFixed(1) + ' MB';
const fmt = s => { s = Math.max(0, Math.round(s||0));
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const when = iso => (iso||'').slice(0,10) || '—';

let VIDEOS = [];

async function load(){
  const j = await (await fetch('api/videos')).json();
  VIDEOS = j.videos || [];
  render();
}

function render(){
  const w = $('wrap'), sub = $('sub');

  if (!VIDEOS.length){
    sub.textContent = 'no videos yet';
    w.innerHTML = '<div class="empty">No rendered video found in any project.<br><br>' +
      'Render one with <code>python3 narration/render_video.py projects/&lt;project&gt; --part 1</code>' +
      '<br>or restore everything with <code>./narration/rebuild.sh</code>, then hit Reload.</div>';
    return;
  }

  const total = VIDEOS.reduce((s,v)=>s+(v.duration||0),0);
  const beats = new Set();
  VIDEOS.forEach(v => (v.beats||[]).forEach(b => beats.add(v.project + ':' + b)));
  sub.textContent = VIDEOS.length + ' video' + (VIDEOS.length>1?'s':'') +
    '  ·  ' + fmt(total) + ' total  ·  ' + beats.size + ' beats cut';

  w.innerHTML = VIDEOS.map((v,i) => {
    const dims = v.width && v.height ? '  ·  ' + v.width + '×' + v.height + ' @ ' + (v.fps||30) + 'fps' : '';
    const span = (v.beats||[]).length
      ? '  ·  beats ' + v.beats[0] + '–' + v.beats[v.beats.length-1] : '';
    return `
    <div class="card" data-i="${i}">
      <div class="head">
        <span class="proj">${esc(v.project)}</span>
        <span class="title">${esc(v.file)}</span>
        <span class="meta">${v.duration ? fmt(v.duration) : '—'}${span}  ·  ${mb(v.bytes)}${dims}  ·  ${when(v.rendered_at)}</span>
      </div>
      <video controls preload="metadata" playsinline src="${v.url}"></video>
      <div class="foot">
        <a class="dl" download href="${v.url}">↓ Download MP4</a>
        ${v.contact ? '<button data-sheet="'+i+'">Show contact sheet</button>' : ''}
        <span class="grow"></span>
        <span style="color:var(--dim);font-size:12px">${esc(v.topic||'')}</span>
      </div>
      <div class="sheetholder"></div>
    </div>`;
  }).join('');

  // one video at a time
  w.querySelectorAll('video').forEach(vid => {
    vid.addEventListener('play', () => {
      w.querySelectorAll('video').forEach(o => { if (o !== vid) o.pause(); });
      w.querySelectorAll('.card').forEach(c => c.classList.remove('playing'));
      vid.closest('.card').classList.add('playing');
    });
  });

  w.querySelectorAll('[data-sheet]').forEach(btn => btn.onclick = () => {
    const i = +btn.dataset.sheet, v = VIDEOS[i];
    const holder = btn.closest('.card').querySelector('.sheetholder');
    if (holder.innerHTML){
      holder.innerHTML = ''; btn.textContent = 'Show contact sheet';
    } else {
      holder.innerHTML = '<img class="sheet" src="' + v.contact +
        '" alt="contact sheet — one frame per beat">';
      btn.textContent = 'Hide contact sheet';
    }
  });
}

$('reload').onclick = load;
load();
</script>
</body>
</html>
