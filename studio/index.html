<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voicebox Studio</title>
<style>
  :root{
    --bg:#0d0f12; --panel:#151920; --panel2:#1c212b; --line:#262d3a;
    --txt:#e7ecf3; --dim:#8b96a8; --accent:#ff5c39; --accent2:#4ade80;
    --warn:#fbbf24;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:14px 20px;
         border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  h1{font-size:16px;margin:0;letter-spacing:.4px}
  h1 span{color:var(--accent)}
  select,button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
                border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
  button:hover,select:hover{border-color:#3a4457}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  .stats{display:flex;gap:10px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line)}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:8px 12px;min-width:96px}
  .stat b{display:block;font-size:17px;line-height:1.2}
  .stat small{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .stat.ok b{color:var(--accent2)} .stat.warn b{color:var(--warn)}

  /* ---- rendered preview (the point of the studio: watch the video) ---- */
  .reel{margin:0;padding:0 20px 20px}
  .reel-card{background:var(--panel);border:1px solid var(--line);
             border-radius:14px;overflow:hidden}
  .reel-head{display:flex;align-items:center;gap:12px;padding:12px 14px;
             border-bottom:1px solid var(--line);flex-wrap:wrap}
  .reel-head h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.9px;
                color:var(--dim)}
  .reel-head .grow{flex:1}
  .reel video{display:block;width:100%;max-height:64vh;background:#000}
  .reel .bar2{display:flex;align-items:center;gap:12px;padding:10px 14px;flex-wrap:wrap;
              border-top:1px solid var(--line)}
  .reel a.dl{color:var(--accent);font-weight:700;font-size:12px;text-decoration:none;
             border:1px solid var(--accent);border-radius:8px;padding:7px 11px}
  .reel a.dl:hover{background:var(--accent);color:#fff}
  .reel .hint{color:var(--dim);font-size:12px}
  .reel .none{padding:26px 16px;color:var(--dim);font-size:13px;text-align:center}
  .reel .none code{background:#0f1218;border:1px solid var(--line);border-radius:6px;
                   padding:2px 6px;color:var(--txt)}
  .contact-btn{font-size:12px}
  .reel img.sheet{display:block;width:100%;border-top:1px solid var(--line)}

  main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;padding:0 20px 24px}
  @media(max-width:1000px){main{grid-template-columns:1fr}}
  /* ---- beat preview stage ---- */
  .stage-wrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .stage{position:relative;aspect-ratio:16/9;background:#f4f1ea;display:flex;
         align-items:center;justify-content:center;overflow:hidden}
  .stage img{width:100%;height:100%;object-fit:contain}
  .frame{width:100%;height:100%;display:flex;flex-direction:column;
         align-items:center;justify-content:center;gap:14px;padding:6% 8%;text-align:center;
         background:repeating-linear-gradient(45deg,#f4f1ea,#f4f1ea 14px,#f0ece3 14px,#f0ece3 28px)}
  .frame .label{font:800 clamp(18px,3.4vw,40px)/1.1 ui-sans-serif,system-ui,sans-serif;
                color:#12161c;letter-spacing:-.5px;text-transform:uppercase}
  .frame .visual{font:500 clamp(11px,1.5vw,17px)/1.45 ui-sans-serif,system-ui,sans-serif;
                 color:#3d4653;max-width:36ch}
  .frame .num{position:absolute;top:12px;left:14px;font:700 12px ui-monospace,monospace;
              color:#9aa3af;letter-spacing:1px}
  .stage .badge{position:absolute;top:12px;right:14px;background:rgba(0,0,0,.72);
                color:#fff;border-radius:6px;padding:4px 9px;font:600 11px ui-monospace,monospace}
  .bar{height:4px;background:#2a3140}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s linear}
  .controls{display:flex;align-items:center;gap:10px;padding:12px 14px;flex-wrap:wrap}
  .narr{padding:0 14px 14px;color:var(--dim);font-size:13px;min-height:38px}
  .narr b{color:var(--txt);font-weight:600}
  /* ---- timeline ---- */
  .tl{background:var(--panel);border:1px solid var(--line);border-radius:14px;
      display:flex;flex-direction:column;max-height:calc(100vh - 220px)}
  .tl h2{margin:0;padding:12px 14px;font-size:13px;text-transform:uppercase;
         letter-spacing:.8px;color:var(--dim);border-bottom:1px solid var(--line)}
  .tl .list{overflow:auto;padding:8px}
  .beat{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:start;
        padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent}
  .beat:hover{background:var(--panel2)}
  .beat.active{background:#221a17;border-color:var(--accent)}
  .beat .id{font:700 12px ui-monospace,monospace;color:var(--dim);padding-top:2px}
  .beat.active .id{color:var(--accent)}
  .beat .txt{min-width:0}
  .beat .lab{font:700 11px/1.3 ui-sans-serif,sans-serif;letter-spacing:.6px;
             color:var(--accent2);text-transform:uppercase}
  .beat .nar{font-size:12px;color:#c3cbd8;overflow:hidden;display:-webkit-box;
             -webkit-line-clamp:2;-webkit-box-orient:vertical}
  .beat .meta{font:600 11px ui-monospace,monospace;color:var(--dim);text-align:right;white-space:nowrap}
  .beat .meta .w{color:#9fb0c6}
  .beat .meta .bad{color:var(--warn)}
  .empty{padding:30px;text-align:center;color:var(--dim)}
  .pill{font:600 10px ui-monospace,monospace;padding:2px 6px;border-radius:5px;
        background:#2a3140;color:var(--dim);margin-left:6px}
  .pill.a{background:#1e3a2a;color:var(--accent2)}
  .sectionnote{padding:0 20px 10px;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Voicebox <span>Studio</span></h1>
  <select id="proj"></select>
  <button id="play">▶ Preview beats</button>
  <button id="prev">⏮</button>
  <button id="next">⏭</button>
  <label style="color:var(--dim);font-size:12px">
    <input type="checkbox" id="auto" checked> auto-advance
  </label>
</header>

<!-- The rendered cut sits at the top of the page: this is what you watch. -->
<section class="reel">
  <div class="reel-card">
    <div class="reel-head">
      <h2>Rendered preview</h2>
      <span id="reelcount" style="color:#5d6779;font-size:12px"></span>
      <span class="grow"></span>
      <select id="rendersel" style="display:none"></select>
      <button class="primary" id="watch">▶ Play video</button>
    </div>
    <div id="reelbody"></div>
  </div>
</section>

<div class="stats" id="stats"></div>
<div class="sectionnote">Beat inspector — the cut before it is rendered.</div>

<main>
  <section class="stage-wrap">
    <div class="stage" id="stage">
      <div class="frame" id="frame">
        <div class="num" id="fnum">BEAT 01</div>
        <div class="label" id="flabel">—</div>
        <div class="visual" id="fvisual">Loading…</div>
      </div>
      <div class="badge" id="fbadge">—</div>
    </div>
    <div class="bar"><i id="progress"></i></div>
    <div class="controls">
      <span id="clock" style="font:600 12px ui-monospace,monospace;color:var(--dim)">0:00 / 0:00</span>
      <span style="margin-left:auto;color:var(--dim);font-size:12px">
        hold <b id="beatsec" style="color:var(--txt)">3.6</b>s per beat
      </span>
    </div>
    <div class="narr" id="narr"></div>
  </section>

  <section class="tl">
    <h2>Beat marks <span id="tlcount" style="color:#5d6779"></span></h2>
    <div class="list" id="list"></div>
  </section>
</main>

<script>
let DATA = null, PROJ = null, idx = 0, playing = false, audio = null, timer = null;

const $ = id => document.getElementById(id);
const fmt = s => { s = Math.max(0, Math.round(s || 0));
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const mb = b => (b/1048576).toFixed(1) + ' MB';
const esc = s => (s||'').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function loadProjects(){
  const r = await fetch('api/projects'); const j = await r.json();
  const sel = $('proj'); sel.innerHTML = '';
  j.projects.forEach(p => {
    const o = document.createElement('option');
    o.value = p.name;
    o.textContent = p.name + '  (' + p.beats + ' beats)';
    sel.appendChild(o);
  });
  if (j.projects.length) select(sel.value);
}

function select(name){ PROJ = name; $('proj').value = name; load(); }

async function load(){
  const r = await fetch('api/beats/' + encodeURIComponent(PROJ));
  DATA = await r.json();
  idx = 0; stop(); renderStats(); renderList(); show(0); renderReel();
}

function renderStats(){
  const b = DATA.beats, n = b.length;
  const inRange = b.filter(x => x.words >= 12 && x.words <= 16).length;
  const withAudio = b.filter(x => x.audio).length;
  const withImg = b.filter(x => x.image).length;
  const dur = DATA.total_duration || b.reduce((s,x)=>s+(x.duration||0),0);
  const bad = b.filter(x => x.duration && (x.duration<2 || x.duration>6)).length;
  const box = (label, val, cls) =>
    `<div class="stat ${cls||''}"><b>${val}</b><small>${label}</small></div>`;
  $('stats').innerHTML =
    box('beats', n) +
    box('12–16 words', inRange + '/' + n, inRange===n ? 'ok':'warn') +
    box('outside 2–6s', bad, bad===0 ? 'ok':'warn') +
    box('voiceover', withAudio + '/' + n, withAudio===n ? 'ok':'') +
    box('images', withImg + '/' + n) +
    box('runtime', fmt(dur)) +
    box('measured', DATA.measured ? 'yes':'est', DATA.measured?'ok':'');
}

/* ---------------- the rendered video ---------------- */

function renderReel(){
  const vids = DATA.renders || [];
  $('reelcount').textContent = vids.length
    ? '· ' + vids.length + ' video' + (vids.length>1?'s':'') : '· none yet';

  if (!vids.length){
    $('rendersel').style.display = 'none';
    $('watch').disabled = true;
    $('reelbody').innerHTML =
      '<div class="none">No rendered video for <b>' + esc(PROJ) + '</b> yet.<br>' +
      'Render one with <code>python3 narration/render_video.py projects/' +
      esc(PROJ) + ' --part 1</code> and reload.</div>';
    return;
  }

  $('rendersel').style.display = '';
  $('rendersel').innerHTML = vids.map((v,i) =>
    '<option value="' + i + '">' + esc(v.file) + '  ·  ' + mb(v.bytes) + '</option>').join('');
  $('watch').disabled = false;

  $('reelbody').innerHTML =
    '<video id="reelvideo" controls preload="metadata" playsinline ' +
      'src="' + vids[0].url + '"></video>' +
    '<div class="bar2">' +
      '<a class="dl" id="reeldl" download href="' + vids[0].url + '">↓ Download MP4</a>' +
      (vids[0].contact
        ? '<button class="contact-btn" id="sheetbtn">Show contact sheet</button>' : '') +
      '<span class="hint">Ranges supported — scrub anywhere in the timeline.</span>' +
    '</div>' +
    '<div id="sheetholder"></div>';

  const vidsNow = vids;
  $('rendersel').onchange = e => {
    const v = vidsNow[+e.target.value];
    const vid = $('reelvideo');
    vid.src = v.url;
    $('reeldl').href = v.url;
    if ($('sheetholder').innerHTML && v.contact){
      $('sheetholder').innerHTML = sheetHtml(v);
    }
    vid.load();
  };

  const sheet = $('sheetbtn');
  if (sheet) sheet.onclick = () => {
    const holder = $('sheetholder');
    if (holder.innerHTML){
      holder.innerHTML = ''; sheet.textContent = 'Show contact sheet';
    } else {
      const v = vidsNow[+$('rendersel').value];
      holder.innerHTML = sheetHtml(v);
      sheet.textContent = 'Hide contact sheet';
    }
  };
}

const sheetHtml = v => '<img class="sheet" src="' + v.contact +
  '" alt="contact sheet — one frame per beat">';

$('watch').onclick = () => {
  stop();                       // never play the beat preview over the video
  const v = $('reelvideo');
  if (!v) return;
  v.scrollIntoView({behavior:'smooth', block:'center'});
  v.currentTime = 0;
  v.play().catch(()=>{});
};

/* ---------------- beat inspector ---------------- */

function renderList(){
  $('tlcount').textContent = '· ' + DATA.beats.length + ' beats';
  $('list').innerHTML = DATA.beats.map((b,i) => `
    <div class="beat" data-i="${i}">
      <div class="id">${String(b.id).padStart(2,'0')}</div>
      <div class="txt">
        <div class="lab">${esc(b.label||'')}</div>
        <div class="nar">${esc(b.narration)}</div>
      </div>
      <div class="meta">
        ${b.duration ? b.duration.toFixed(2)+'s' : '—'}
        <span class="w ${b.words<12||b.words>16?'bad':''}">${b.words}w</span><br>
        ${b.audio?'<span class="pill a">VO</span>':''}
        ${b.image?'<span class="pill a">IMG</span>':''}
      </div>
    </div>`).join('');
  $('list').querySelectorAll('.beat').forEach(el =>
    el.onclick = () => { stop(); show(+el.dataset.i); });
}

function show(i){
  if (!DATA || !DATA.beats.length) return;
  idx = Math.max(0, Math.min(i, DATA.beats.length-1));
  const b = DATA.beats[idx];

  $('list').querySelectorAll('.beat').forEach((el,k) =>
    el.classList.toggle('active', k===idx));
  const active = $('list').querySelector('.beat.active');
  if (active) active.scrollIntoView({block:'nearest', behavior:'smooth'});

  $('fnum').textContent  = 'BEAT ' + String(b.id).padStart(2,'0');
  $('flabel').textContent = b.label || '';
  $('fvisual').textContent = b.visual || '';
  $('fbadge').textContent = (b.duration ? b.duration.toFixed(2)+'s' : '—')
                          + '  ·  ' + b.words + 'w';
  $('narr').innerHTML = '<b>' + esc(b.label||'Beat '+b.id) + ':</b> ' + esc(b.narration);
  $('beatsec').textContent = (b.duration||3.6).toFixed(2);
  const start = b.start || 0, dur = DATA.total_duration || 0;
  $('clock').textContent = fmt(start) + ' / ' + fmt(dur);
  $('progress').style.width = dur ? (start/dur*100)+'%' : '0%';
}

function playBeat(){
  const b = DATA.beats[idx];
  if (!b) return stop();
  if (audio) { audio.pause(); audio = null; }
  clearTimeout(timer);
  const hold = (b.duration || 3.6) * 1000;
  if (b.audio){
    audio = new Audio(b.audio);
    audio.play().catch(()=>{});
    audio.onended = () => next();
    timer = setTimeout(next, hold);
  } else {
    timer = setTimeout(next, hold);
  }
}

function next(){
  if (!playing) return;
  if (idx >= DATA.beats.length-1) return stop();
  show(idx+1); playBeat();
}

function start(){
  const v = $('reelvideo');
  if (v && !v.paused) v.pause();       // video and beat preview are exclusive
  if (!DATA || !DATA.beats.length) return;
  playing = true; $('play').textContent = '⏸ Pause'; playBeat();
}
function stop(){
  playing = false; $('play').textContent = '▶ Preview beats';
  clearTimeout(timer);
  if (audio) { audio.pause(); audio = null; }
}

$('play').onclick = () => playing ? stop() : start();
$('next').onclick = () => { stop(); show(idx+1); };
$('prev').onclick = () => { stop(); show(idx-1); };
$('proj').onchange = e => select(e.target.value);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (e.code === 'Space'){ e.preventDefault(); playing ? stop() : start(); }
  if (e.code === 'ArrowRight'){ stop(); show(idx+1); }
  if (e.code === 'ArrowLeft'){ stop(); show(idx-1); }
});
loadProjects();
</script>
</body>
</html>
